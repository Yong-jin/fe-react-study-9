<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- submit 이 발생했는지 여부 판단은 naver 경로로 이동하는가 -->
    <form action="https://naver.com">

        사용자 ID : <input type="text"> <br>
        비밀 번호 : <input type="password">
        <button type="button">완료</button>

        <br><br>

        <select>
            <option>짜장면</option>
            <option selected>짬뽕</option>
            <option>탕수육</option>
        </select>

        <br>

        <label>짜장면 <input type="checkbox"></label>
        <label>짬뽕 <input type="checkbox" checked></label>
        <label>탕수육 <input type="checkbox"></label>

        <br>

        이름 : <input type="text"> <br>
        암호 : <input type="password">

        <br>

        자소서 : <textarea>이곳에 자기소개서 작성</textarea>
        
        <br><br>

        검색 : <input type="text">
        <button type="button">Q1</button>
        <input type="button" value="Q2">

        <br>

        submit 버튼 : 
        <button type="submit">전송1</button>
        <input type="submit" value="전송2">

        <br>

        reset 버튼 : 
        <button type="reset">리셋1</button>
        <input type="reset" value="리셋2">

    </form>

</body>
</html>
